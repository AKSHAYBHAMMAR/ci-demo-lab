name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify HTML File
        run: test -f index.html

      - name: Verify CI Content
        run: grep -q "CI Pipeline Working!" index.html

      - name: CI Success
        run: echo "CI Pipeline executed successfully!"
